# inference.yaml - Parameter Inferensi
#
# Seluruh nilai di sini bersifat statis: dibaca sekali saat startup dan tidak
# berubah saat sistem berjalan. Tidak ada auto-tuning, penyesuaian adaptif,
# maupun endpoint untuk mengubahnya.
#
# Nilai bertanda TBD diisi dari hasil kalibrasi di Step 6 dan 7, berdasarkan
# run sungguhan dan bukan tebakan.

version: "0.2.0-step2"

# MODEL
models:
  detection:
    path: models/onnx/yolo11n-defect.onnx
    imgsz: 640
    # Disamakan dengan decision.binary_threshold. Bila NMS menyaring di atas
    # ambang keputusan, ambang keputusan tidak akan pernah tercapai dan
    # nilainya menjadi hiasan belaka.
    conf_threshold: 0.22
    iou_threshold: 0.45
    max_detections: 30

  segmentation:
    path: models/onnx/yolo11n-seg-defect.onnx
    imgsz: 640
    mask_threshold: 0.5

  anomaly:
    # PaDiM yang dilatih pada gabungan keempat kategori yang juga dilatih
    # detektor. Model satu kategori tidak dapat dipakai di sini: bagi model
    # yang hanya mengenal botol, kacang mete pun terbaca sebagai anomali.
    path: models/onnx/padim-combined.onnx
    imgsz: 256

  ocr:
    engine: paddleocr
    lang: en
    use_gpu: false  # OCR di CPU saja - sisakan VRAM untuk model utama

# AMBANG KEPUTUSAN  (dasar teori: STATISTICS.md)
decision:

  # bagian Luas cacat - batas toleransi produk
  # Diturunkan dari standar toleransi cacat kemasan, dikonfirmasi lewat validasi.
  area_pct_threshold: 2.0

  # Ambang anomali dihitung dengan teori nilai ekstrem, bukan dipilih tangan.
  # Diturunkan pada model gabungan empat kategori, yang sama dengan model yang
  # benar-benar dipakai saat penyajian.
  # Ambang per kategori tunggal ada di reports/metrics/anomaly_results.json.
  anomaly_threshold: 39.7942
  anomaly_target_far: 0.01  # laju alarm palsu target 1%
  anomaly_evt_params:
    xi: 0.2411  # parameter bentuk GPD; positif berarti ekor berat
    sigma: 4.5026  # parameter skala GPD
    u: 25.7742  # ambang POT awal, kuantil ke-90
    ks_p_value: 0.970  # diagnostik kecocokan; GPD tidak ditolak
    calibration_n: 294  # sampel normal yang tidak ikut dilatih

  # Conformal prediction menentukan kapan sistem menahan keputusan.
  # Alpha dipilih pada SET KALIBRASI memakai aturan yang dinyatakan: ambil
  # jaminan sekuat mungkin yang masih menyisakan cukup keputusan untuk diambil
  # sistem sendiri, dengan batas menahan 15 persen. Sistem QC yang menyerahkan
  # mayoritas produk ke manusia tidak menyelesaikan apa pun.
  conformal:
    alpha: 0.1
    mode: mondrian
    review_budget: 0.15
    alpha_selected_on: calibration
    quantiles:
      normal: 0.0211
      defect: 0.925
    empirical_coverage: 0.9415
    coverage_normal: 0.9381
    coverage_defect: 0.9615
    review_rate: 0.0279

  # Kalibrasi kepercayaan. Temperature scaling dicoba lebih dulu tetapi justru
  # memperburuk ECE karena tidak punya intersep sehingga tidak dapat menggeser
  # skor ke proporsi kelas yang sebenarnya. Platt scaling yang dipakai.
  calibration:
    method: platt
    platt_slope: 2.8253
    platt_intercept: 2.69
    ece_before: 0.0497
    ece_after: 0.0145
    brier_after: 0.0145

  # bagian Ambang sensitif biaya (STATISTICS.md bagian 8)
  # τ* = C_FP / (C_FP + C_FN)
  cost:
    c_false_reject: 2000  # Rp - produk bagus salah ditolak
    c_missed_defect: 50000  # Rp - cacat lolos ke konsumen
    c_review: 500  # Rp - biaya waktu operator memeriksa
    # Proporsi cacat yang diasumsikan terjadi di lini produksi. Split uji
    # memuat sekitar 14 persen cacat setelah diperluas dengan gambar normal,
    # masih jauh di atas kenyataan lini produksi. Tanpa koreksi ini,
    # perhitungan biaya condong ke arah menolak terlalu banyak produk.
    # Nilai 0.03 adalah ASUMSI yang belum diverifikasi terhadap data nyata.
    assumed_defect_prevalence: 0.03
    bayes_threshold: 0.0385  # C_FP / (C_FP + C_FN) = 2000 / 52000
    # Ambang yang benar-benar dipakai, hasil minimum biaya pada set kalibrasi.
    # Setelah set kalibrasi diperluas dengan gambar normal, ambang ini
    # menggeneralisasi: pada split uji biayanya 21,4 persen lebih murah
    # daripada ambang 0,50.
    operating_threshold: 0.3

  # bagian Mode keputusan
  # Mode biner tidak pernah mengembalikan REVIEW: setiap gambar dinyatakan
  # PASS atau REJECT. Lini produksi yang menyerahkan sebagian produk ke manusia
  # memang lebih aman, tetapi tujuan sistem ini adalah memutuskan sendiri.
  #
  # Ambangnya dipilih pada SET KALIBRASI dengan meminimumkan biaya yang
  # diharapkan pada model biaya di bawah, bukan dipilih dari hasil set uji.
  # Memilihnya dari set uji akan membuat angka yang dilaporkan tidak sah.
  mode: binary
  binary_threshold: 0.22
  binary_threshold_selected_on: calibration
  binary_calibration:
    recall: 0.9298
    specificity: 0.9805
    cost_per_item: 143.2
    false_rejects: 6
    missed_defects: 4
    n: 364

  # Dipakai hanya pada mode three_class, ketika sistem masih boleh menahan
  # keputusan. Disimpan karena tahap Final berencana memakainya kembali.
  min_confidence: 0.60

# KELAS CACAT
# Taksonomi 5 kelas, hasil penyatuan 30+ label mentah MVTec AD dan VisA
# (lihat src/visionqc_ai/data/taxonomy.py - pemetaan lengkapnya ditulis di
# sana supaya bisa diaudit). Urutan id WAJIB sama dengan DEFECT_CLASSES;
# id yang bergeser membuat bobot hasil training tidak lagi bermakna.
classes:
  - id: 0
    name: pecah
    label_id: "Pecah / Retak"
    severity_weight: 0.9
  - id: 1
    name: gores
    label_id: "Gores"
    severity_weight: 0.4
  - id: 2
    name: noda
    label_id: "Noda Warna"
    severity_weight: 0.6
  - id: 3
    name: kotor
    label_id: "Kontaminasi"
    severity_weight: 1.0  # paling kritis: berdampak langsung pada keamanan pangan
  - id: 4
    name: deformasi
    label_id: "Deformasi"
    severity_weight: 0.5

# PRIVASI  (PRIVACY.md) - semua wajib menyala
privacy:
  strip_exif: true  # A2 - hapus seluruh metadata
  blur_faces: true  # A1 - data biometrik, UU PDP Pasal 4(2)
  face_blur_kernel: 45
  ephemeral_buffers: true  # A3 - gambar tidak pernah menyentuh disk
  hash_only_logging: true  # A6 - log hanya SHA-256
  ocr_allowlist_only: true  # A4 - hanya pola kode batch yang dipertahankan
  # Daftar-izin kode batch. Pola pertama sebelumnya tidak cocok dengan format
  # yang dicontohkan kontrak API sendiri, yaitu B240815-021, karena hanya
  # mengizinkan satu blok angka tanpa pemisah di tengahnya.
  ocr_patterns:
    - '^[A-Z]{1,3}\d{4,10}(?:[-/]\d{2,5})?$'
    - '^\d{2}[/.]\d{2}[/.]\d{2,4}$'
    - '^(?:LOT|BN|EXP)[-: ]?[A-Z0-9]{4,12}$'
  no_network_calls: true  # A8 - diverifikasi lewat pengujian di Step 10

# MASUKAN
input:
  max_file_size_mb: 10
  allowed_formats: [jpg, jpeg, png, webp]
  min_dimension: 224
  max_dimension: 4096

# RUNTIME
runtime:
  provider: CPUExecutionProvider  # ONNX di CPU  panitia tidak wajib punya GPU
  warmup_on_startup: true  # 1 inferensi dummy agar permintaan pertama tidak lambat
  intra_op_threads: 4
  return_annotated_image: true
  return_anomaly_heatmap: true
