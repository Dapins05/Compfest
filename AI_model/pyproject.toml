[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionqc-ai"
version = "1.0.0"
description = "Modul AI VisionQC untuk inspeksi kualitas kemasan pangan dan minuman"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python-headless>=4.9.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "scipy>=1.14.0",
    "ultralytics>=8.4.0",
    "onnxruntime>=1.18.0",
]

[project.optional-dependencies]
train = ["torch>=2.2.0", "torchvision>=0.17.0", "anomalib>=2.6.0", "matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
