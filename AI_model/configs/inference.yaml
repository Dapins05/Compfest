# inference.yaml - Parameter Inferensi
#
# Seluruh nilai di sini bersifat statis: dibaca sekali saat startup dan tidak
# berubah saat sistem berjalan. Tidak ada auto-tuning, penyesuaian adaptif,
# maupun endpoint untuk mengubahnya.
#
# Nilai bertanda TBD diisi dari hasil kalibrasi di Step 6 dan 7, berdasarkan
# run sungguhan dan bukan tebakan.

version: "0.3.0-goodsad"

# MODEL
models:
  detection:
    path: models/onnx/yolo11n-defect.onnx
    imgsz: 640
    # WAJIB berada di bawah decision.binary_threshold. Bila NMS menyaring di
    # atas ambang keputusan, ambang keputusan tidak akan pernah tercapai dan
    # nilainya menjadi hiasan belaka. Ambang keputusan kini 0,195; NMS sengaja
    # dibiarkan lebih rendah agar deteksi lemah tetap sampai ke decision
    # engine dan dapat dipakai aturan luas maupun kelas kritis. Rasionya
    # dipertahankan seperti pasangan sebelumnya (0,22 terhadap 0,35).
    conf_threshold: 0.12
    iou_threshold: 0.45
    max_detections: 30

  segmentation:
    path: models/onnx/yolo11n-seg-defect.onnx
    imgsz: 640
    mask_threshold: 0.5

  anomaly:
    # PaDiM yang dilatih pada gabungan SEPULUH kategori. Model satu kategori
    # tidak dapat dipakai di sini: bagi model yang hanya mengenal botol,
    # kacang mete pun terbaca sebagai anomali. Datasetnya dibangun
    # scripts/build_combined_anomaly.py, 60 gambar per kategori agar seimbang.
    path: models/onnx/padim-combined.onnx
    imgsz: 256

  ocr:
    # Pembacaan kode batch. Mesinnya dipakai apa adanya tanpa pelatihan ulang;
    # OCR di sini komponen pelengkap, bukan model inovasi inti, sehingga
    # kewajiban fine-tuning tidak berlaku padanya.
    #
    # enabled DIMATIKAN, dan itu keadaan yang diukur, bukan pilihan gaya.
    # paddleocr 2.7.3 yang terpasang tidak dapat diimpor bersama lingkungan
    # ini karena dua sebab sekaligus:
    #   1. paddlepaddle 2.6.2 menuntut protobuf <= 3.20, terpasang 7.35.1
    #   2. paddleocr 2.7.3 memakai np.sctypes, dihapus pada NumPy 2.0
    # Naik ke paddleocr 3.7 tidak menyelesaikannya: resolusinya menarik
    # opencv-contrib-python 4.10 berdampingan dengan OpenCV 5 yang dipakai
    # pipeline, dan tetap menuntut paddlepaddle 3.x.
    #
    # Karena itu jalur OCR tersambung penuh tetapi dimatikan. batch_code akan
    # bernilai null, BUKAN membuat inspeksi gagal. Menyalakannya kembali cukup
    # dengan mengubah enabled menjadi true setelah dependensinya beres; tidak
    # ada kode yang perlu diubah.
    enabled: false
    engine: paddleocr
    lang: en
    use_gpu: false  # OCR di CPU saja - sisakan VRAM untuk model utama

# AMBANG KEPUTUSAN  (dasar teori: STATISTICS.md)
decision:

  # bagian Luas cacat - batas toleransi produk
  # Diturunkan dari standar toleransi cacat kemasan, dikonfirmasi lewat validasi.
  area_pct_threshold: 2.0

  # Ambang anomali dihitung dengan teori nilai ekstrem, bukan dipilih tangan.
  # Diturunkan pada model gabungan sepuluh kategori, yang sama dengan model
  # yang benar-benar dipakai saat penyajian.
  # Ambang per kategori tunggal ada di reports/metrics/anomaly_results.json.
  # Diukur ulang 23 Agustus 2026 pada model gabungan 10 kategori.
  anomaly_threshold: 83.2714
  anomaly_target_far: 0.01  # laju alarm palsu target 1%
  anomaly_evt_params:
    xi: -0.4585  # parameter bentuk GPD; negatif berarti ekor terbatas
    sigma: 24.5823  # parameter skala GPD
    u: 48.3106  # ambang POT awal, kuantil ke-90
    ks_p_value: 0.8414  # diagnostik kecocokan; GPD tidak ditolak
    calibration_n: 120  # sampel normal yang tidak ikut dilatih
    # PERINGATAN, dibaca sebelum mengandalkan jalur anomali:
    #   AUROC gambar hanya 0,6019, turun dari 0,890 pada model empat kategori.
    #   Pada ambang di atas, jalur ini menangkap 3,99 persen cacat sementara
    #   laju alarm palsunya pada data tertahan 2,32 persen, dua kali lipat
    #   target. Sebabnya dapat diterangkan: PaDiM mencocokkan satu Gaussian
    #   per posisi patch, sedangkan "normal" untuk sepuluh jenis produk yang
    #   sangat berbeda bukan sebaran unimodal. Ini penjelasan yang masuk akal,
    #   bukan hasil pengukuran tersendiri.
    image_auroc: 0.6019
    defect_recall_at_threshold: 0.0399
    held_out_false_alarm_rate: 0.0232

  # Conformal prediction menentukan kapan sistem menahan keputusan.
  # Alpha dipilih pada SET KALIBRASI memakai aturan yang dinyatakan: ambil
  # jaminan sekuat mungkin yang masih menyisakan cukup keputusan untuk diambil
  # sistem sendiri, dengan batas menahan 15 persen. Sistem QC yang menyerahkan
  # mayoritas produk ke manusia tidak menyelesaikan apa pun.
  conformal:
    alpha: 0.1
    mode: mondrian
    review_budget: 0.15
    alpha_selected_on: calibration
    quantiles:
      normal: 0.3015
      defect: 0.8837
    empirical_coverage: 0.8918
    coverage_normal: 0.9027
    coverage_defect: 0.8779
    review_rate: 0.1331
    # Jaminan 0,90 TIDAK tercapai pada set uji: 0,8918. Jaminan conformal
    # bersifat marginal dan berlaku dalam ekspektasi, jadi meleset tipis pada
    # satu set uji memang mungkin terjadi. Dicatat apa adanya, bukan
    # disembunyikan. Pada mode biner angka ini tidak menentukan apa pun karena
    # sistem tidak pernah menahan keputusan.
    guarantee_met: false

  # Kalibrasi kepercayaan. Diukur ulang 22 Agustus 2026 pada model GoodsAD.
  #
  # Hasilnya berubah arah: pada model lama Platt scaling memperbaiki ECE dari
  # 0,0497 ke 0,0145. Pada model baru KEDUA metode justru memperburuk, jadi
  # skor mentah yang dipakai.
  #
  #   mentah       ECE kalibrasi 0,1212  ECE uji 0,1284   <- dipilih
  #   temperature  ECE kalibrasi 0,1664  ECE uji 0,1767
  #   platt        ECE kalibrasi 0,1334  ECE uji 0,1502
  #
  # slope 1,0 dan intersep 0,0 adalah pemetaan identitas, karena
  # sigmoid(logit(p)) = p. Nilai inilah cara menyatakan "tanpa kalibrasi"
  # tanpa perlu mengubah kode decision engine.
  #
  # ECE 0,1284 jauh lebih buruk daripada 0,0145 milik model lama. Sebabnya
  # belum dipastikan; dugaan paling masuk akal, sebaran data kini jauh lebih
  # beragam sehingga satu pemetaan global tidak lagi cukup. Perbaikannya
  # kemungkinan kalibrasi per kategori, dan itu pekerjaan tahap Final.
  calibration:
    method: mentah
    platt_slope: 1.0
    platt_intercept: 0.0
    ece_before: 0.1284
    ece_after: 0.1284
    mce_after: 0.4009
    brier_after: 0.1304

  # bagian Ambang sensitif biaya (STATISTICS.md bagian 8)
  # τ* = C_FP / (C_FP + C_FN)
  cost:
    c_false_reject: 2000  # Rp - produk bagus salah ditolak
    c_missed_defect: 50000  # Rp - cacat lolos ke konsumen
    c_review: 500  # Rp - biaya waktu operator memeriksa
    # Proporsi cacat yang diasumsikan terjadi di lini produksi. Split uji
    # memuat sekitar 14 persen cacat setelah diperluas dengan gambar normal,
    # masih jauh di atas kenyataan lini produksi. Tanpa koreksi ini,
    # perhitungan biaya condong ke arah menolak terlalu banyak produk.
    # Nilai 0.03 adalah ASUMSI yang belum diverifikasi terhadap data nyata.
    assumed_defect_prevalence: 0.03
    bayes_threshold: 0.0385  # C_FP / (C_FP + C_FN) = 2000 / 52000
    # Ambang yang benar-benar dipakai, hasil minimum biaya pada set kalibrasi.
    # Pada split uji biayanya 16,0 persen lebih murah daripada ambang 0,50.
    operating_threshold: 0.35

  # bagian Mode keputusan
  # Mode biner tidak pernah mengembalikan REVIEW: setiap gambar dinyatakan
  # PASS atau REJECT. Lini produksi yang menyerahkan sebagian produk ke manusia
  # memang lebih aman, tetapi tujuan sistem ini adalah memutuskan sendiri.
  #
  # Ambangnya dipilih pada SET KALIBRASI dengan meminimumkan biaya yang
  # diharapkan pada model biaya di bawah, bukan dipilih dari hasil set uji.
  # Memilihnya dari set uji akan membuat angka yang dilaporkan tidak sah.
  mode: binary
  # Dipilih ulang 22 Agustus 2026 pada model yang dilatih memakai PKU-GoodsAD.
  # Dipilih HANYA pada set kalibrasi; set uji tidak dilihat saat memilih.
  binary_threshold: 0.195
  binary_threshold_selected_on: calibration
  binary_calibration:
    recall: 0.7970
    specificity: 0.9086
    cost_per_item: 481.8
    false_rejects: 31
    missed_defects: 55
    n: 610
    defects: 271

  # Dipakai hanya pada mode three_class, ketika sistem masih boleh menahan
  # keputusan. Disimpan karena tahap Final berencana memakainya kembali.
  min_confidence: 0.60

# KELAS CACAT
# Taksonomi 6 kelas, hasil penyatuan 38 label mentah MVTec AD, VisA, dan
# PKU-GoodsAD (lihat src/visionqc_ai/data/taxonomy.py - pemetaan lengkapnya
# ditulis di sana supaya bisa diaudit). Urutan id WAJIB sama dengan
# DEFECT_CLASSES; id yang bergeser membuat bobot hasil training tidak lagi
# bermakna.
#
# terbuka ditambahkan 21 Agustus 2026 bersama PKU-GoodsAD. Kelas ini TIDAK
# dimasukkan ke critical_classes; layak-tidaknya diputuskan dari data
# kalibrasi setelah diukur, bukan ditebak di muka.
classes:
  - id: 0
    name: pecah
    label_id: "Pecah / Retak"
    severity_weight: 0.9
  - id: 1
    name: gores
    label_id: "Gores"
    severity_weight: 0.4
  - id: 2
    name: noda
    label_id: "Noda Warna"
    severity_weight: 0.6
  - id: 3
    name: kotor
    label_id: "Kontaminasi"
    severity_weight: 1.0  # paling kritis: berdampak langsung pada keamanan pangan
  - id: 4
    name: deformasi
    label_id: "Deformasi"
    severity_weight: 0.5
  - id: 5
    name: terbuka
    label_id: "Segel Terbuka"
    severity_weight: 0.9  # kemasan tak lagi tersegel: produk tidak boleh dikirim

# PRIVASI  (PRIVACY.md) - semua wajib menyala
privacy:
  strip_exif: true  # A2 - hapus seluruh metadata
  blur_faces: true  # A1 - data biometrik, UU PDP Pasal 4(2)
  face_blur_kernel: 45
  ephemeral_buffers: true  # A3 - gambar tidak pernah menyentuh disk
  hash_only_logging: true  # A6 - log hanya SHA-256
  ocr_allowlist_only: true  # A4 - hanya pola kode batch yang dipertahankan
  # Daftar-izin kode batch. Pola pertama sebelumnya tidak cocok dengan format
  # yang dicontohkan kontrak API sendiri, yaitu B240815-021, karena hanya
  # mengizinkan satu blok angka tanpa pemisah di tengahnya.
  ocr_patterns:
    - '^[A-Z]{1,3}\d{4,10}(?:[-/]\d{2,5})?$'
    - '^\d{2}[/.]\d{2}[/.]\d{2,4}$'
    - '^(?:LOT|BN|EXP)[-: ]?[A-Z0-9]{4,12}$'
  no_network_calls: true  # A8 - diverifikasi lewat pengujian di Step 10

# MASUKAN
input:
  max_file_size_mb: 10
  allowed_formats: [jpg, jpeg, png, webp]
  min_dimension: 224
  max_dimension: 4096

# RUNTIME
runtime:
  provider: CPUExecutionProvider  # ONNX di CPU  panitia tidak wajib punya GPU
  warmup_on_startup: true  # 1 inferensi dummy agar permintaan pertama tidak lambat
  intra_op_threads: 4
  return_annotated_image: true
  return_anomaly_heatmap: true
